; ECG monitor firmware. Build and flash from this folder:
;   pio run -e esp32dev -t upload
;   pio device monitor -e esp32dev
[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
board_build.filesystem = littlefs
monitor_speed = 921600
upload_speed = 921600
build_src_filter = +<*> -<selftest.cpp>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.6.0
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0

; Model and pipeline self-test with no Wi-Fi or display. See tools/run_qemu_selftest.py
[env:qemu_selftest]
monitor_speed = 115200
build_src_filter = -<*> +<selftest.cpp> +<classifiers.cpp>
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
